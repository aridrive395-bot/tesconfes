<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ada yang ingin kusampaikan</title>
<link rel="icon" href="assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400;1,6..96,500&family=Outfit:wght@300;400&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="langit"><div class="malam"></div><div class="siang"></div></div>
<canvas id="taman"></canvas>
<canvas id="fx"></canvas>

<button id="musik" hidden aria-label="Musik">♪</button>
<audio id="audio" src="assets/music/lagu.mp3" loop autoplay preload="auto"></audio>

<!-- 1. Pembuka -->
<section class="layar aktif" id="intro">
  <svg class="kuncup" viewBox="0 0 80 140" aria-hidden="true">
    <path d="M40 138C38 104 44 80 40 54" stroke="#9be3a8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M40 112c-18-2-28-14-30-26 16 0 28 8 30 26z" fill="#6fcf8c"/>
    <path d="M41 96c16-2 26-12 28-24-15 0-26 8-28 24z" fill="#8fe0a4"/>
    <g class="tulip"><path d="M24 22c0 22 8 34 16 34s16-12 16-34c-7 6-10 3-16-6-6 9-9 12-16 6z" fill="#ff8fab"/><path d="M40 16c-6 9-9 12-16 6 2 22 8 34 16 34z" fill="#ff6b8b"/></g>
  </svg>
  <p class="kecil">sebuah pesan untuk</p>
  <h1 id="untuk">Kamu</h1>
  <button class="tombol" id="buka">Buka pelan-pelan</button>
</section>

<!-- 2. Pesan -->
<section class="layar" id="pesan">
  <p class="kalimat" id="teks"></p>
  <p class="isyarat" id="lanjut">ketuk untuk lanjut</p>
  <div class="titik" id="titik"></div>
</section>

<!-- 3. Pertanyaan -->
<section class="layar" id="tanya">
  <p class="kecil" id="halo"></p>
  <h2 id="pertanyaan"></h2>
  <div class="pilihan">
    <button class="tombol ya" id="ya">Iya, aku mau</button>
    <button class="tombol" id="tidak">Tidak</button>
  </div>
</section>

<!-- 4. Akhir -->
<section class="layar" id="akhir">
  <div class="penutup">
    <h2 id="terima"></h2>
    <p id="kata"></p>
    <p class="ttd" id="ttd"></p>
  </div>
  <p class="isyarat" id="tap">ketuk layar untuk menanam bunga</p>
</section>

<script src="script.js"></script>
</body>
</html>
